<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>근처 맛집·술집 - 할로윈 에디션</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 디자인: Google Stitch "Spooky Night Out" 디자인 시스템 기반 -->
  <header class="topbar">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <svg class="cobweb" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M0,0 Q60,10 100,100M0,0 Q30,40 100,100M0,0 Q10,60 100,100M20,0 Q40,40 0,60M45,0 Q70,45 0,85M70,0 Q90,70 0,100" />
    </svg>

    <div class="topbar-row">
      <div class="brand">
        <span class="brand-logo">🎃<span class="bat float">🦇</span></span>
        <h1>근처 맛집·술집 <span class="brand-tag">HALLOWEEN NIGHT</span></h1>
      </div>

      <form id="search-form" class="search" autocomplete="off">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="address" type="search" placeholder="주소나 장소명 (예: 강남역, 성수동)" aria-label="주소나 장소명" />
        <button type="submit" class="btn btn-primary">검색</button>
        <button type="button" id="locate" class="btn btn-ghost" title="현재 위치 사용">📍 내 위치</button>
        <ul id="suggestions" class="suggestions" hidden></ul>
      </form>

      <div class="moon-badge">🌕 오늘 밤 어디 갈까? <span class="bat float-delayed">🦇</span></div>
    </div>

    <div class="filter-row">
      <div class="chips" role="tablist" aria-label="카테고리">
        <button class="chip active" data-type="all" role="tab"><span class="dot"></span>전체</button>
        <button class="chip" data-type="food" role="tab">🎃 맛집</button>
        <button class="chip" data-type="bar" role="tab">🦇 술집</button>
      </div>
      <label class="radius">
        <span>탐색 반경</span>
        <select id="radius">
          <option value="300">반경 300m</option>
          <option value="500" selected>반경 500m</option>
          <option value="1000">반경 1km</option>
          <option value="2000">반경 2km</option>
        </select>
      </label>
    </div>
  </header>

  <main class="layout">
    <aside class="panel">
      <div class="panel-head">
        <div id="status" class="status">주소를 입력하거나 <b>📍 내 위치</b>를 눌러주세요.</div>
        <div id="origin" class="origin" hidden></div>
      </div>
      <ol id="list" class="list"></ol>
      <footer class="panel-foot">
        <span id="source">데이터: -</span>
        <span>🕸️ 가까운 순</span>
      </footer>
    </aside>

    <section class="map-wrap">
      <div id="map" class="map"></div>
      <div class="map-style" role="group" aria-label="지도 스타일">
        <button class="active" data-style="dark">🎃 할로윈 다크맵</button>
        <button data-style="light">일반 지도</button>
      </div>
      <div id="legend" class="legend" hidden>
        <span>🎃 맛집 <b id="count-food">0</b></span>
        <span>🦇 술집 <b id="count-bar">0</b></span>
        <span class="legend-me"><i></i>기준 위치</span>
      </div>
      <button id="recenter" class="recenter" title="기준 위치로 이동" hidden>◎</button>
      <div class="deco" aria-hidden="true">
        <span class="float" style="top:10%;left:30%">🦇</span>
        <span class="float-delayed" style="top:55%;right:8%;font-size:14px">🦇</span>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
