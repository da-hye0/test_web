<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>근처 맛집·술집</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <meta name="theme-color" content="#17171c" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="locked">
  <!-- 첫 화면: 로그인 -->
  <section id="gate" class="gate" aria-labelledby="gate-title">
    <!-- 사진은 Unsplash 라이선스 (README 참고) -->
    <div class="gate-photos" aria-hidden="true">
      <img src="img/login-grill.jpg" alt="" class="on" />
      <img src="img/login-table.jpg" alt="" loading="lazy" />
      <img src="img/login-stall.jpg" alt="" loading="lazy" />
    </div>

    <div class="gate-panel">
      <div class="gate-brand"><img src="logo.svg" alt="" width="28" height="28" />근처 맛집·술집</div>

      <div class="gate-inner">
        <h1 id="gate-title">오늘 갈 곳,<br />가까운 데서 찾아요</h1>
        <p class="gate-sub">지금 있는 곳 주변 맛집과 술집을 지도에서 바로 볼 수 있어요.</p>

        <div class="gate-buttons">
          <a class="sns kakao" href="/auth/kakao" data-provider="kakao" hidden>
            <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1.5C4.6 1.5 1 4.3 1 7.8c0 2.2 1.5 4.2 3.7 5.3l-.9 3.4c-.1.3.3.5.5.3l4-2.7h.7c4.4 0 8-2.8 8-6.3S13.4 1.5 9 1.5z" /></svg>
            카카오로 시작하기
          </a>
          <a class="sns naver" href="/auth/naver" data-provider="naver" hidden>
            <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M11.4 9.6 6.4 2.5H2.5v13h4.1V8.4l5 7.1h3.9v-13h-4.1z" /></svg>
            네이버로 시작하기
          </a>
          <a class="sns google" href="/auth/google" data-provider="google" hidden>
            <svg viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.7H9v3.3h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z" />
              <path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.3 0-4.3-1.6-5-3.7H1v2.3A9 9 0 0 0 9 18z" />
              <path fill="#FBBC05" d="M4 10.7a5.4 5.4 0 0 1 0-3.4V5H1a9 9 0 0 0 0 8l3-2.3z" />
              <path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 1 5l3 2.3c.7-2.1 2.7-3.7 5-3.7z" />
            </svg>
            구글로 시작하기
          </a>
        </div>
        <p id="gate-status" class="gate-status" role="alert" hidden></p>
        <p class="gate-note">로그인하면 찜한 가게가 저장돼요.</p>
      </div>

      <p class="gate-foot">© 2026 근처 맛집·술집</p>
    </div>
  </section>

  <main class="layout">
    <!-- 모바일: 검색창·필터를 지도 위쪽에 띄운다 (app.js가 PC 목록에서 옮겨 옴) -->
    <div id="mobile-top" class="mobile-top"></div>
    <aside class="panel">
      <!-- 목록 오른쪽에 튀어나온 접기/펴기 탭. 접으면 화면 왼쪽 끝에 남는다 -->
      <!-- 모바일 시트 손잡이 -->
      <button type="button" class="sheet-handle" aria-label="목록 크기 바꾸기"><i></i></button>
      <button type="button" id="panel-tab" class="panel-tab" aria-label="목록 닫기" aria-expanded="true">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
      </button>
      <header class="panel-top">
        <div class="top-row">
          <h1 class="wordmark"><img src="logo.svg" alt="" />근처 맛집·술집</h1>
          <div class="top-right">
            <div id="account" class="account">
              <div id="profile" class="profile" hidden>
                <img id="profile-image" alt="" hidden />
                <span id="profile-avatar" class="avatar" aria-hidden="true" hidden></span>
                <span id="profile-name"></span>
                <button type="button" id="logout" class="logout" aria-label="로그아웃" title="로그아웃">
                  <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10" /></svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <form id="search-form" class="search" autocomplete="off">
          <div class="search-field">
            <input id="address" type="search" placeholder="동네, 역, 주소" aria-label="동네, 역, 주소" />
            <button type="submit" class="search-submit">검색</button>
          </div>
          <button type="button" id="locate" class="locate">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" /><path d="M8 0v3M8 13v3M0 8h3M13 8h3" /></svg>
            현재 위치에서 찾기
          </button>
          <ul id="suggestions" class="suggestions" hidden></ul>
        </form>

        <div class="filters">
          <div class="tabs" role="tablist" aria-label="종류">
            <button class="tab active" data-type="all" role="tab" aria-selected="true">전체 <span id="count-all"></span></button>
            <button class="tab" data-type="food" role="tab" aria-selected="false">맛집 <span id="count-food"></span></button>
            <button class="tab" data-type="bar" role="tab" aria-selected="false">술집 <span id="count-bar"></span></button>
            <button class="tab" data-type="fav" role="tab" aria-selected="false">찜 <span id="count-fav"></span></button>
            <button class="tab" data-type="ai" role="tab" aria-selected="false" hidden>AI <span id="count-ai"></span></button>
          </div>
          <select id="radius" class="radius" aria-label="검색 반경">
            <option value="300">300m</option>
            <option value="500" selected>500m</option>
            <option value="1000">1km</option>
            <option value="2000">2km</option>
          </select>
        </div>
      </header>

      <div class="panel-meta">
        <p id="status" class="status">어디 근처에서 찾을지 정해 주세요.</p>
        <p id="origin" class="origin" hidden></p>
      </div>

      <ol id="list" class="list"></ol>

      <footer class="panel-foot">
        <span id="source"></span>
        <span>가까운 순</span>
      </footer>
    </aside>

    <section class="map-wrap">
      <div id="map" class="map"></div>
      <div id="route-card" class="route-card" hidden></div>
      <!-- 로드뷰: 지도(.map)의 다크 필터가 걸리지 않도록 지도 밖에 둔다 -->
      <div id="roadview-wrap" class="roadview-wrap" hidden>
        <div id="roadview" class="roadview"></div>
        <div class="roadview-bar">
          <span id="roadview-title"></span>
          <button type="button" id="roadview-close" class="roadview-close" aria-label="로드뷰 닫기">✕</button>
        </div>
        <p id="roadview-empty" class="roadview-empty" hidden>이 근처에는 로드뷰가 없어요.</p>
      </div>
      <button type="button" id="research" class="research" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8A5.5 5.5 0 1 1 11.9 4.1M13.5 1.5v3h-3" /></svg>
        이 지역에서 다시 찾기
      </button>
      <!-- AI 채팅 추천 (서버에 GEMINI_API_KEY가 있을 때만 보인다) -->
      <button type="button" id="ai-open" class="ai-open" hidden>
        <svg class="ai-spark" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 9.3 6.2 14 7.5 9.3 8.8 8 13.5 6.7 8.8 2 7.5 6.7 6.2z" /></svg> AI에게 물어보기
      </button>
      <section id="ai-chat" class="ai-chat" aria-label="AI 추천 채팅" hidden>
        <header class="ai-head">
          <b>AI 추천</b>
          <span id="ai-sub" class="ai-sub">카카오 장소·블로그 후기를 찾아보고 답해요</span>
          <button type="button" id="ai-close" class="ai-close" aria-label="채팅 닫기">✕</button>
        </header>
        <ol id="ai-log" class="ai-log" aria-live="polite">
          <li class="ai-msg bot">어떤 자리를 찾고 있어요? 인원, 지역, 분위기를 알려 주면 골라 볼게요.
            <div id="ai-examples" class="ai-examples">
              <button type="button" data-example>회식하기 좋은 고깃집 추천해줘</button>
              <button type="button" data-example>을지로에서 조용히 와인 마시기 좋은 곳</button>
              <button type="button" data-example>이 근처 혼밥하기 좋은 곳</button>
            </div>
          </li>
        </ol>
        <form id="ai-form" class="ai-form">
          <textarea id="ai-input" rows="1" maxlength="500" placeholder="인원, 지역, 분위기를 편하게 적어 주세요" aria-label="AI에게 질문"></textarea>
          <button type="submit" id="ai-send" class="ai-send" aria-label="보내기">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" /></svg>
          </button>
        </form>
      </section>
      <button id="recenter" class="recenter" title="검색 범위 전체 보기" aria-label="검색 범위 전체 보기" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4" /></svg>
      </button>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="icons.js"></script>
  <script src="map.js"></script>
  <script src="providers.js"></script>
  <script src="app.js"></script>
</body>
</html>
